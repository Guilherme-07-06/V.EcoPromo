<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoPromo - Acesso</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <div class="login-container">
        <div class="logo-area">
            <h1><span class="v-logo">V.</span><span class="eco">Eco</span><span class="promo">Promo</span></h1>
        </div>

        <div id="tela-login" class="form-area slide-up-animation">
            <h2>Bem-vindo(a)!</h2>
            <form action="cupons.html">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="Digite seu e-mail" required>

                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="Digite sua senha" required>

                <button type="submit" class="btn-login">Entrar</button>
            </form>
            <p class="register-link">Ainda não tem conta? <a href="#" id="link-cadastro">Cadastre-se aqui</a></p>
        </div>

    
        <div id="tela-cadastro" class="form-area" style="display: none;">
            <h2>Crie sua conta</h2>
            <form action="cupons.html">
                <label for="nome-cad">Nome</label>
                <input type="text" id="nome-cad" placeholder="Seu nome completo" required>

                <label for="email-cad">E-mail</label>
                <input type="email" id="email-cad" placeholder="Digite seu e-mail" required>

                <label>Telefone</label>
                <input type="tel" id="cadTelefone" placeholder="(xx) xxxxx-xxxx" required>

                <label>Cidade</label>
                <input type="text" id="cadCidade" placeholder="Sua Cidade, Estado" required>

                <label for="senha-cad">Senha</label>
                <input type="password" id="senha-cad" placeholder="Crie uma senha" required>

                <button type="submit" class="btn-cadastro">Cadastrar</button>
            </form>
            <p class="register-link">Já tem uma conta? <a href="#" id="link-login">Faça Login</a></p>
        </div>
    </div>

   
    <script src="script.js"></script>
</body>
</html>
